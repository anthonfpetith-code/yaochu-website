<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AIGC 内容团队 · 团队介绍</title>
<meta name="description" content="AIGC 内容团队：创始人王雅各（遥触灵境 CEO）、王梁正（联合创始人）与陈琪昌、葛蔚斌、陈昊男、周于凯、陈家龙、施润宇、周正鸿、谢千星、戴思阳、李自长、张启伟、朱江江十二位导师。覆盖平台操盘、AIGC 视频工作流、企业 AI 培训交付、AIGC 实战教学与企业转型、AI 教育与编程教学、AI 商业操盘与短剧 IP 策划、影视剧集与网络短剧创作、AI 短剧资产制作与画面质检等方向。">
<style>
  :root{
    --bg:#F5F5F7;
    --bg-soft:#FFFFFF;
    --card:#FFFFFF;
    --ink:#1D1D1F;
    --ink-dim:#6E6E73;
    --ink-faint:#AEAEB2;
    --line:rgba(0,0,0,.06);
    --tint:#0071E3;
    --shadow-1:0 2px 8px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.06);
    --shadow-2:0 4px 12px rgba(0,0,0,.06),0 20px 48px rgba(0,0,0,.10);
    --nav-bg:rgba(255,255,255,.72);
    --dock-bg:rgba(255,255,255,.65);
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#1D1D1F;
    --bg-soft:#1D1D1F;
    --card:#2C2C2E;
    --ink:#F5F5F7;
    --ink-dim:#A1A1A6;
    --ink-faint:#636366;
    --line:rgba(255,255,255,.08);
    --shadow-1:0 2px 8px rgba(0,0,0,.24),0 12px 32px rgba(0,0,0,.32);
    --shadow-2:0 4px 12px rgba(0,0,0,.28),0 20px 48px rgba(0,0,0,.40);
    --nav-bg:rgba(28,28,30,.68);
    --dock-bg:rgba(44,44,46,.62);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.7;
    overflow-x:hidden;transition:background .5s ease,color .5s ease}
  ::selection{background:rgba(0,113,227,.22)}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px}

  /* ===== 主题按钮（右下角悬浮小圆钮） ===== */
  .theme-btn{position:fixed;right:22px;bottom:22px;z-index:60;
    width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);color:var(--ink);cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-1);
    transition:transform .3s ease,box-shadow .3s ease}
  .theme-btn:hover{transform:scale(1.08);box-shadow:var(--shadow-2,var(--shadow-1))}
  .theme-btn:active{transform:scale(.94)}

  /* ===== 音效开关（主题按钮左侧） ===== */
  .sound-btn{right:70px}
  .sound-btn svg{width:17px;height:17px;display:block}
  .sound-btn .slash{display:none}
  .sound-btn.muted .slash{display:block}
  .sound-btn.muted .waves{display:none}

  /* ===== 顶部滚动进度线 ===== */
  .scroll-progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:80;
    background:linear-gradient(90deg,var(--tint),#7C5CFC);
    border-radius:0 2px 2px 0;opacity:.85;pointer-events:none}

  /* ===== Hero ===== */
  header{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:clamp(60px,8vh,100px) 0 clamp(30px,4vh,60px)}
  header::before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);
    width:min(960px,130vw);height:100%;pointer-events:none;z-index:-1;
    background:radial-gradient(ellipse 65% 55% at 50% 45%,rgba(0,113,227,.09),transparent 72%)}
  html[data-theme="dark"] header::before{
    background:radial-gradient(ellipse 65% 55% at 50% 45%,rgba(124,92,252,.13),transparent 72%)}
  .hero-tag{font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--ink-dim);
    text-transform:uppercase;margin-bottom:14px}
  h1{font-size:clamp(38px,7vw,64px);font-weight:700;letter-spacing:-.02em;line-height:1.08}
  .sub{margin-top:18px;font-size:clamp(15px,2.2vw,18px);color:var(--ink-dim);max-width:620px;line-height:1.75}
  .sub b{color:var(--ink);font-weight:600}
  .count-row{margin-top:26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .count-pill{display:inline-flex;align-items:baseline;gap:7px;padding:8px 18px;border-radius:999px;
    background:var(--card);box-shadow:var(--shadow-1);font-size:13px;color:var(--ink-dim);
    transition:transform .3s ease,box-shadow .3s ease}
  .count-pill b{font-size:19px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .count-pill:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
  .demo-pill{text-decoration:none;color:#0053C2;font-weight:700;cursor:pointer;
    border:1px solid var(--line);transition:border-color .3s ease,transform .3s ease,box-shadow .3s ease;
    --glow:rgba(0,83,194,.32);
    animation:pulseGlow 2.8s ease-in-out infinite}
  html[data-theme="dark"] .demo-pill{color:#6FB4FF;--glow:rgba(111,180,255,.34)}
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 0 0 0 var(--glow)}
    55%{box-shadow:0 0 0 12px transparent}
  }
  .demo-pill b{color:inherit}
  .demo-pill:hover{animation:none;transform:translateY(-2px);box-shadow:var(--shadow-1);border-color:rgba(10,132,255,.45)}
  a.count-pill{text-decoration:none;color:var(--ink-dim);cursor:pointer}
  main section{scroll-margin-top:76px}
  html{scroll-behavior:smooth}

  /* ===== 分组标题 ===== */
  .group-head{display:flex;align-items:baseline;gap:14px;margin:clamp(64px,9vw,110px) 0 clamp(16px,2.5vw,24px)}
  .group-head .zh{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.01em}
  .group-head .en{font-size:12px;font-weight:600;color:var(--ink-faint);letter-spacing:.18em;text-transform:uppercase}

  /* ===== 创始人横卡 ===== */
  .fgrid{display:grid;gap:20px}
  .fcard{position:relative;display:grid;grid-template-columns:240px 1fr;background:var(--card);
    border-radius:24px;box-shadow:var(--shadow-1);text-decoration:none;color:inherit;overflow:hidden;
    transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s ease}
  .fcard:hover{transform:translateY(-5px) scale(1.005);box-shadow:var(--shadow-2)}
  .fcard .photo-box{position:relative;background:var(--bg);min-height:250px}
  .fcard .photo-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;
    transition:transform .6s cubic-bezier(.22,1,.36,1)}
  .fcard:hover .photo-box img{transform:scale(1.04)}
  .fcard .body{padding:26px 30px;display:flex;flex-direction:column;min-width:0}
  .fcard .name-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .fcard .name{font-size:clamp(26px,3.4vw,34px);font-weight:700;letter-spacing:-.01em}
  .fcard .title{font-size:13.5px;font-weight:600;color:var(--c);letter-spacing:.02em}
  .fcard .desc{margin-top:12px;font-size:14.5px;color:var(--ink-dim);line-height:1.85;flex:1}
  .fcard .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .fcard .chip{font-size:12.5px;font-weight:500;color:var(--ink-dim);padding:5px 14px;
    border-radius:999px;background:var(--bg)}
  .fcard .go{margin-top:18px;font-size:13.5px;font-weight:600;color:var(--c);
    display:inline-flex;align-items:center;gap:6px}
  .fcard .go::after{content:"→";transition:transform .3s ease}
  .fcard:hover .go::after{transform:translateX(4px)}

  /* ===== 导师网格 ===== */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-bottom:clamp(120px,16vw,160px)}
  .card{position:relative;display:flex;flex-direction:column;background:var(--card);
    border-radius:22px;box-shadow:var(--shadow-1);text-decoration:none;color:inherit;overflow:hidden;
    transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s ease}
  .card:hover{transform:translateY(-6px);box-shadow:var(--shadow-2)}
  .photo-box{position:relative;aspect-ratio:4/5;background:var(--bg);overflow:hidden}
  .photo-box img{width:100%;height:100%;object-fit:cover;object-position:top center;
    transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .5s ease}
  .card:hover .photo-box img{transform:scale(1.045)}
  .badge{position:absolute;top:14px;left:14px;padding:5px 13px;border-radius:999px;
    background:rgba(255,255,255,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:11.5px;font-weight:600;color:#1D1D1F;letter-spacing:.02em;z-index:2}
  .body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1;min-width:0}
  .name-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .name{font-size:21px;font-weight:700;letter-spacing:-.01em}
  .title{font-size:12.5px;font-weight:600;color:var(--c)}
  .desc{margin-top:8px;font-size:13.5px;color:var(--ink-dim);line-height:1.75;flex:1;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{font-size:11.5px;font-weight:500;color:var(--ink-dim);padding:4px 11px;border-radius:999px;background:var(--bg)}
  .more{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);
    font-size:12.5px;font-weight:600;color:var(--ink-faint);letter-spacing:.04em;
    display:flex;align-items:center;justify-content:space-between;transition:color .3s ease}
  .card:hover .more{color:var(--c)}
  .more::after{content:"→"}

  footer{padding:34px 0 140px;text-align:center;font-size:12.5px;color:var(--ink-faint);letter-spacing:.06em}

  /* ===== Dock（4 人窗口 · 悬停滚轮横滑） ===== */
  .dock{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:70;
    display:flex;flex-direction:column;align-items:center}
  .dock-tip{margin-bottom:9px;padding:5px 13px;border-radius:10px;background:var(--card);
    box-shadow:var(--shadow-2);font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;
    opacity:0;transform:translateY(4px);pointer-events:none;
    transition:opacity .22s ease,transform .22s ease}
  .dock-tip.show{opacity:1;transform:translateY(0)}
  .dock-scroll{display:flex;gap:9px;padding:9px 13px;border-radius:24px;max-width:246px;
    background:var(--dock-bg);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);
    border:1px solid var(--line);box-shadow:var(--shadow-2);
    overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;overscroll-behavior-x:contain;
    --ml:0;--mr:1;
    mask-image:linear-gradient(90deg,rgba(0,0,0,var(--ml)) 0,#000 16px,#000 calc(100% - 16px),rgba(0,0,0,var(--mr)) 100%);
    -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,var(--ml)) 0,#000 16px,#000 calc(100% - 16px),rgba(0,0,0,var(--mr)) 100%)}
  .dock-scroll::-webkit-scrollbar{display:none}
  .dock-item{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;
    text-decoration:none;transition:transform .28s cubic-bezier(.22,1,.36,1)}
  .dock-item img{width:44px;height:44px;border-radius:13px;object-fit:cover;object-position:top center;
    box-shadow:0 2px 8px rgba(0,0,0,.18);transition:box-shadow .3s ease}
  .dock-item .dot{width:4px;height:4px;border-radius:50%;background:var(--ink-faint);margin-top:5px;
    transition:background .3s ease}
  .dock-item:hover .dot{background:var(--c)}

  /* 入场动画 */
  .rise{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}
  .rise.in{opacity:1;transform:translateY(0)}

  @media (max-width:900px){
    .grid{grid-template-columns:1fr 1fr}
  }
  /* ===== 漂浮物彩蛋 ===== */
  #bg-objs{position:fixed;inset:0;z-index:-2;pointer-events:none}
  .float-toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);z-index:90;
    padding:11px 22px;border-radius:999px;background:rgba(29,29,31,.88);color:#fff;font-size:13px;font-weight:600;
    letter-spacing:.02em;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 10px 32px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .45s ease,transform .45s ease}
  .float-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @keyframes microShake{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-3px,1px)}
    40%{transform:translate(3px,-1px)}
    60%{transform:translate(-2px,-1px)}
    80%{transform:translate(2px,1px)}
  }
  body.shake{animation:microShake .32s ease}
  @media (max-width:640px){
    .grid{grid-template-columns:1fr}
    .fcard{grid-template-columns:1fr}
    .fcard .photo-box{min-height:0;aspect-ratio:4/3}
    .fcard .photo-box img{position:absolute}
    .dock-scroll{gap:6px;padding:7px 9px;border-radius:20px;max-width:198px}
    .dock-item img{width:36px;height:36px;border-radius:11px}
  }
</style>
</head>
<body>

<canvas id="bg-objs" aria-hidden="true"></canvas>
<div class="float-toast" id="floatToast">能量已注入 AIGC 流水线 🎬</div>

<div class="scroll-progress" id="scrollProgress" style="width: 11.6144%;"></div>
<button class="theme-btn" id="themeBtn" aria-label="切换深浅色" title="切换深浅色">☀</button>
<button class="theme-btn sound-btn" id="soundFab" aria-label="音效开关" title="漂浮物音效开关">

</button>

<header class="wrap">

  </div>
</header>

<main class="wrap">
  <section id="founders">
    <div class="group-head rise in"><span class="zh">创始人</span><span class="en">Founder</span></div>
    <div class="fgrid" id="fgrid"></div>

  <section id="mentors">
    <div class="group-head rise in"><span class="zh">导师团队</span><span class="en">Mentors</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <footer class="rise">AIGC 内容团队 · 团队介绍</footer>
</main>

<nav class="dock" id="dock" aria-label="成员快速导航">
  <div class="dock-tip" id="dockTip"></div>
  <div class="dock-scroll" id="dockScroll"></div></nav>

/* ---- 数字滚动（count-up） ---- */
function countUp(el, target, dur){
  dur = dur || 900;
  const t0 = performance.now();
  const step = now => {
    const p = Math.min((now - t0) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(e * target);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

const finePointer = matchMedia("(pointer:fine)").matches;
if (finePointer){
  const attachTilt = el => {
    let tx = 0, ty = 0, cx = 0, cy = 0, raf = null;
    const MAX = 2.6, DAMP = .13, LIFT = 3;
    const loop = () => {
      cx += (tx - cx) * DAMP;
      cy += (ty - cy) * DAMP;
      const settled = tx === 0 && ty === 0 && Math.abs(cx) < .002 && Math.abs(cy) < .002;
      el.style.transform = settled ? "" :
        `perspective(1100px) rotateX(${(-cy * MAX).toFixed(2)}deg) rotateY(${(cx * MAX).toFixed(2)}deg) translateY(-${LIFT}px)`;
      if (settled){ raf = null; return; }
      raf = requestAnimationFrame(loop);
    };
    const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };
    el.addEventListener("mousemove", e => {
      const r = el.getBoundingClientRect();
      tx = (e.clientX - r.left) / r.width - .5;
      ty = (e.clientY - r.top) / r.height - .5;
      kick();
    });
    el.addEventListener("mouseleave", () => { tx = 0; ty = 0; kick(); });
  };
  document.querySelectorAll(".fcard, .card").forEach(attachTilt);
}

(() => {

  /* ---- 音效引擎：Web Audio 实时合成（零音频文件） ---- */
  const AudioFX = (() => {
    let ac = null, muted = localStorage.getItem("zz-sound") === "off", lastAt = 0;
    const ensure = () => {
      try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
      if (ac.state === "suspended") ac.resume();
      return ac;
    };
    const play = name => {
      if (muted) return;
      const now = performance.now();
      if (now - lastAt < 150) return;                      // 节流：150ms 内只响一声
      const c = ensure(); if (!c) return;
      lastAt = now;
      const t = c.currentTime;
      const master = c.createGain(); master.gain.value = .16; master.connect(c.destination);
      const mk = (type, f0, f1, dur, at, vol) => {          // 单音：f1 有值则滑向
        const osc = c.createOscillator(), g = c.createGain();
        osc.type = type; osc.frequency.setValueAtTime(f0, t + at);
        if (f1) osc.frequency.exponentialRampToValueAtTime(f1, t + at + dur);
        g.gain.setValueAtTime(0, t + at);
        g.gain.linearRampToValueAtTime(vol, t + at + .012);
        g.gain.exponentialRampToValueAtTime(.0001, t + at + dur);
        osc.connect(g); g.connect(master);
        osc.start(t + at); osc.stop(t + at + dur + .05);
      };
      const noise = (dur, at, vol, freq) => {               // 噪声脉冲（键盘/快门质感）
        const n = c.createBufferSource();
        const buf = c.createBuffer(1, Math.max(1, c.sampleRate * dur | 0), c.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        n.buffer = buf;
        const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = freq || 1800; bp.Q.value = 1.2;
        const g = c.createGain();
        g.gain.setValueAtTime(vol, t + at);
        g.gain.exponentialRampToValueAtTime(.0001, t + at + dur);

    respawn(edge){

      this.x = rnd(this.size + 10, W - this.size - 10);
      if (edge){ this.y = Math.random() < .5 ? H + this.size + rnd(30, 120) : -this.size - rnd(30, 120); }

    hit(px, py){

        if (this.x < m){ this.x = m; this.vx = Math.abs(this.vx); }

        if (this.y < m){ this.y = m; this.vy = Math.abs(this.vy); }

        ctx.fillStyle = on ? `rgba(${this.color},${Math.min(a + .16, .48)})` : `rgba(${this.color},${a * .4})`;
        ctx.fillRect(-s * .3, -h * .22, s * .26, h * .44);
        ctx.fillRect(s * .05, -h * .22, s * .26, h * .44);
        ctx.strokeStyle = `rgba(${this.color},${Math.min(a + .12, .4)})`;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(-s * .38, -h * .42); ctx.lineTo(s * .38, -h * .42); ctx.stroke();
      } else if (this.type === "bubble"){                 // 玻璃气泡：星点内嵌
        const w = s * .92, h = s * .68;
        const sq = Math.sin(this.wob) * .06;
        ctx.scale(1 + sq, 1 - sq);
        ctx.beginPath(); roundRect(-w / 2, -h / 2, w, h, s * .2); ctx.fill();
        ctx.beginPath();                                   // 尾巴
        ctx.moveTo(-s * .1, h / 2 - 1);
        ctx.lineTo(s * .06, h / 2 + s * .2);
        ctx.lineTo(s * .18, h / 2 - 1);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = `rgba(${this.color},${Math.min(a + .12, .5)})`;
        ctx.beginPath(); ctx.arc(-s * .22, -h * .1, s * .045, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(s * .1, h * .08, s * .03, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(-s * .02, h * .2, s * .025, 0, 7); ctx.fill();
      } else if (this.type === "pixel"){                   // 像素块：四象限微错位 + 内芯
        const q = s * .46, off = s * .05;
        ctx.fillRect(-q - off, -q - off, q, q);
        ctx.fillRect(off, -q + off * .6, q, q);
        ctx.fillRect(-q + off * .6, off, q, q);
        ctx.fillRect(q * .2, q * .2 + off, q, q);
        ctx.fillStyle = `rgba(${this.color},${a * .45})`;
        ctx.fillRect(-s * .16, -s * .16, s * .32, s * .32);
      } else if (this.type === "token"){                   // 提示词条：胶囊 + 打字点/闪烁光标
        const w = s * 1.06, h = s * .52;
        ctx.beginPath(); roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
        ctx.fillStyle = `rgba(${this.color},${Math.min(a + .14, .5)})`;
        if (this.flash > 0){                                // 打字中：圆点依次点亮
          const n = Math.min(4, Math.floor((1 - Math.max(0, (this.launchAt - performance.now()) / 420)) * 4) + 1);
          for (let i = 0; i < n; i++){ ctx.beginPath(); ctx.arc(-w * .28 + i * w * .19, 0, s * .05, 0, 7); ctx.fill(); }
        } else {                                            // 待机：闪烁光标
          if (Math.floor(performance.now() / 500) % 2 === 0) ctx.fillRect(w * .3, -h * .18, s * .05, h * .36);
          ctx.beginPath(); ctx.arc(-w * .24, 0, s * .035, 0, 7); ctx.fill();
        }
      } else if (this.type === "spark"){                   // 生成火花：四芒星 + 芯点
        const L = s * .58, l = s * .16;
        ctx.beginPath();
        ctx.moveTo(0, -L); ctx.lineTo(l, -l); ctx.lineTo(L, 0); ctx.lineTo(l, l);
        ctx.lineTo(0, L); ctx.lineTo(-l, l); ctx.lineTo(-L, 0); ctx.lineTo(-l, -l);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = `rgba(${this.color},${Math.min(a + .15, .5)})`;
        ctx.beginPath(); ctx.arc(0, 0, s * .1, 0, 7); ctx.fill();
      } else {                                              // 神经节点：三角簇 + 沿线脉冲
        const pts = [[-s * .3, -s * .16], [s * .3, s * .08], [-s * .02, s * .3]];
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]); ctx.lineTo(pts[1][0], pts[1][1]);
        ctx.lineTo(pts[2][0], pts[2][1]); ctx.closePath(); ctx.stroke();
        pts.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], s * .11, 0, 7); ctx.fill(); });
        const t = (this.wob % 6.28) / 6.28;
        const seg = Math.floor(t * 3), lt = t * 3 - seg;
        const a1 = pts[seg], a2 = pts[(seg + 1) % 3];
        ctx.fillStyle = `rgba(${this.color},${Math.min(a + .2, .55)})`;
        ctx.beginPath(); ctx.arc(a1[0] + (a2[0] - a1[0]) * lt, a1[1] + (a2[1] - a1[1]) * lt, s * .05, 0, 7); ctx.fill();
      }
      ctx.restore();
    }
  }
  function roundRect(x, y, w, h, r){
    if (ctx.roundRect){ ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  /* 实例 + 粒子 */
  const floaters = [];
  TYPES.forEach(t => { for (let i = 0; i < QUOTA[t]; i++) floaters.push(new Floater(t)); });
  const bursts = [];                                     // 气泡爆裂粒子
  const shards = [];                                      // 像素分裂碎片
  const fireworks = [];                                   // 火花绽放粒子

  /* 连击彩蛋（10 秒击飞 6 个） */
  const knocks = [];
  const onKnockout = f => {
    knocks.push(performance.now());
    while (knocks.length && performance.now() - knocks[0] > 10000) knocks.shift();
    if (knocks.length >= 6){
      knocks.length = 0;
      AudioFX.play("combo");
      document.body.classList.add("shake");
      setTimeout(() => document.body.classList.remove("shake"), 360);
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2400);
    }
  };

  /* 交互（document 级转发，canvas 底层不挡页面） */
  let drag = null, hoverOne = null, suppressClick = false;
  const findAt = (x, y) => { for (let i = floaters.length - 1; i >= 0; i--) if (floaters[i].hit(x, y)) return floaters[i]; return null; };
  const setCursor = c => { document.body.style.cursor = c; };

  document.addEventListener("pointerdown", e => {
    if (e.button !== 0 && e.pointerType === "mouse") return;
    const f = findAt(e.clientX, e.clientY);
    if (!f) return;
    drag = { f, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t0: performance.now(),
             lvx: 0, lvy: 0, la: performance.now() };
    f.state = "drag"; f.jitter = f.type === "pixel" ? 1 : 0;
    setCursor("grabbing"); suppressClick = true;
    e.preventDefault();
  });
  document.addEventListener("pointermove", e => {
    if (drag){
      const f = drag.f, now = performance.now();
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      const dtms = Math.max(now - drag.la, 1);
      drag.lvx = dx / dtms * 16; drag.lvy = dy / dtms * 16;       // 每帧速度
      drag.la = now;
      f.x += dx; f.y += dy;
      f.va = Math.max(-.22, Math.min(.22, f.va + dx * .0035));     // 拖转
      drag.x = e.clientX; drag.y = e.clientY;
    } else {
      const f = findAt(e.clientX, e.clientY);
      if (f !== hoverOne){ hoverOne && (hoverOne.hover = false); hoverOne = f; f && (f.hover = true); }
      setCursor(f ? "grab" : "");
    }
  });
  document.addEventListener("pointerup", e => {
    if (!drag) return;
    const f = drag.f, dt = performance.now() - drag.t0;
    const moved = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy);
    f.jitter = 0;
    if (moved < 8 && dt < 350){                                    // 点击：物种专属 + 音效
      AudioFX.play(f.type);
      if (f.type === "film"){ f.flash = 1; f.launchAt = performance.now() + 420; }
      else if (f.type === "token"){ f.flash = 1; f.launchAt = performance.now() + 420; }
      else if (f.type === "bubble"){
        for (let i = 0; i < 6; i++) bursts.push({ x: f.x, y: f.y, vx: rnd(-2.4, 2.4), vy: rnd(-2.4, 2.4),
          r: rnd(2.5, 5.5), life: 1 });
        f.state = "dead"; f.rebirth = rnd(6000, 11000); onKnockout(f);
      }
      else if (f.type === "pixel"){
        for (let i = 0; i < 4; i++) shards.push({ x: f.x, y: f.y, vx: rnd(-2.8, 2.8), vy: rnd(-2.8, 2.8),
          s: f.size * .4, life: 1 });
        f.state = "dead"; f.rebirth = rnd(6000, 11000); onKnockout(f);
      }
      else if (f.type === "spark"){
        for (let i = 0; i < 8; i++) fireworks.push({ x: f.x, y: f.y, vx: rnd(-2.2, 2.2), vy: rnd(-3.6, -.6),
          r: rnd(1.8, 3.6), life: 1 });
        f.state = "dead"; f.rebirth = rnd(6000, 11000); onKnockout(f);
      }
      else f.launch(e.clientX, e.clientY, 11), onKnockout(f);
    } else {                                                        // 甩出
      f.vx = Math.max(-20, Math.min(20, drag.lvx));
      f.vy = Math.max(-20, Math.min(20, drag.lvy));
      f.state = Math.hypot(f.vx, f.vy) > .6 ? "flying" : "idle";
    }
    drag = null; setCursor(hoverOne ? "grab" : "");
  });
  document.addEventListener("click", e => {                        // 吞掉点击漂浮物时的穿透
    if (suppressClick && findAt(e.clientX, e.clientY)){ e.preventDefault(); e.stopPropagation(); }
    suppressClick = false;
  }, true);
  document.addEventListener("pointercancel", () => {
    if (!drag) return;
    drag.f.state = "idle"; drag.f.jitter = 0; drag = null; setCursor("");
  });
  document.addEventListener("touchmove", e => { if (drag) e.preventDefault(); }, { passive: false });

  /* 主循环 */
  let raf = 0, last = performance.now();
  const loop = () => {
    const now = performance.now(), dt = Math.min(now - last, 50); last = now;
    ctx.clearRect(0, 0, W, H);
    floaters.forEach(f => { f.update(dt); f.draw(); });
    for (let i = bursts.length - 1; i >= 0; i--){
      const p = bursts[i];
      p.x += p.vx; p.y += p.vy; p.vx *= .985; p.vy *= .985; p.life -= dt / 900;
      if (p.life <= 0){ bursts.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(${pal.bubble},${p.life * .5})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, 7); ctx.fill();
    }
    for (let i = shards.length - 1; i >= 0; i--){
      const p = shards[i];
      p.x += p.vx; p.y += p.vy; p.vx *= .98; p.vy *= .98; p.life -= dt / 1100;
      if (p.life <= 0){ shards.splice(i, 1); continue; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 5);
      ctx.fillStyle = `rgba(${pal.pixel},${p.life * .4})`;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s);
      ctx.restore();
    }
    for (let i = fireworks.length - 1; i >= 0; i--){             // 火花：重力弧线散落
      const p = fireworks[i];
      p.x += p.vx; p.y += p.vy; p.vy += .045; p.vx *= .988; p.life -= dt / 1200;
      if (p.life <= 0){ fireworks.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(${pal.spark},${p.life * .55})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, 7); ctx.fill();
    }
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else { last = performance.now(); raf = requestAnimationFrame(loop); }
  });

  /* ---- 音效开关（右下角，主题按钮左侧） ---- */
  const soundFab = document.getElementById("soundFab");
  if (soundFab){
    const syncSound = () => soundFab.classList.toggle("muted", AudioFX.muted);
    soundFab.addEventListener("click", () => { AudioFX.toggle(); syncSound(); });
    syncSound();
  }
})();
</script>


</body></html>
